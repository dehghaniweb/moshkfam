<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کاتالوگ محصولات مشکفام فارس</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f7f4;
  color:#222
}
header{
  background:#176b35;
  color:#fff;
  padding:18px;
  text-align:center
}
header h1{margin:0 0 8px;font-size:22px}
header p{margin:0;font-size:13px}
.container{padding:15px;max-width:900px;margin:auto}
.userbox,.adminbox{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001
}
.adminbox{
  border:2px solid #d5a300;
  background:#fffdf0
}
button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px
}
.adminbtn{background:#d5a300;color:#fff;width:100%;font-weight:bold}
.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:12px
}
.cat{
  background:#fff;
  border:1px solid #ddd;
  white-space:nowrap
}
.cat.active{background:#176b35;color:#fff}
.search{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:15px;
  font-size:15px
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px
}
.card{
  background:#fff;
  border-radius:14px;
  padding:10px;
  box-shadow:0 2px 7px #0001;
  cursor:pointer
}
.card img{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  border-radius:10px;
  background:#f5f5f5
}
.card h3{font-size:14px;margin:9px 0 4px}
.card p{font-size:11px;color:#777;margin:0}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:10;
  padding:15px;
  overflow:auto
}
.modalbox{
  background:#fff;
  border-radius:16px;
  max-width:700px;
  margin:30px auto;
  padding:18px
}
.close{
  background:#eee;
  float:left
}
.detailimg{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:12px;
  background:#f5f5f5
}
.adminrow{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  background:#fff
}
.adminrow strong{display:block;margin-bottom:8px}
.pricewrap{
  display:flex;
  gap:7px;
  align-items:center
}
.priceinput{
  flex:1;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  direction:ltr;
  text-align:left
}
.editbtn{background:#eee}
.savebtn{background:#176b35;color:#fff}
.currency{
  font-size:12px;
  color:#666;
  white-space:nowrap
}
.msg{
  padding:10px;
  border-radius:9px;
  margin-bottom:10px;
  display:none
}
.success{background:#dff5e5;color:#176b35}
.error{background:#ffe1e1;color:#a00}
.loading{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  <h1>🌾 کاتالوگ محصولات مشکفام فارس</h1>
  <p>معرفی محصولات کودی و تغذیه گیاه</p>
</header>

<div class="container">

  <div class="userbox">
    <div id="userInfo">در حال دریافت اطلاعات...</div>
  </div>

  <div id="adminBox" class="adminbox" style="display:none">
    <button class="adminbtn" onclick="openAdmin()">
      ⚙️ پنل مدیریت قیمت محصولات
    </button>
  </div>

  <input id="search" class="search"
         placeholder="🔎 جستجوی محصول..."
         oninput="renderProducts()">

  <div id="categories" class="categories"></div>

  <div id="products" class="products">
    <div class="loading">در حال بارگذاری محصولات...</div>
  </div>

</div>

<!-- Product Modal -->
<div id="productModal" class="modal">
  <div class="modalbox">
    <button class="close" onclick="closeModal('productModal')">✕</button>
    <div id="productDetail"></div>
  </div>
</div>

<!-- Admin Modal -->
<div id="adminModal" class="modal">
  <div class="modalbox">
    <button class="close" onclick="closeModal('adminModal')">✕</button>
    <h2>⚙️ مدیریت قیمت محصولات</h2>

    <div id="adminMsg" class="msg"></div>
    <div id="adminProducts">در حال بارگذاری...</div>
  </div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){
  tg.ready();
  tg.expand();
}

var WORKER_URL =
  "https://moshkfam-telegram-bot.dehghaniweb.workers.dev";

var IMAGE_BASE =
  "https://raw.githubusercontent.com/dehghaniweb/moshkfam/main/images/";

var products = [];
var categories = [];
var currentCategory = "همه";
var authData = null;
var isAdmin = false;

/* -----------------------------
   Telegram Authentication
----------------------------- */

async function authenticate(){

  if(!tg || !tg.initData){
    document.getElementById("userInfo").innerHTML =
      "⚠️ برنامه را از داخل تلگرام باز کنید.";
    loadProducts();
    return;
  }

  try{

    var response = await fetch(
      WORKER_URL + "/api/telegram-auth",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "X-Telegram-Init-Data":tg.initData
        },
        body:JSON.stringify({
          initData:tg.initData
        })
      }
    );

    var data = await response.json();

    if(!response.ok || !data.ok){
      throw new Error(data.error || "خطا در احراز هویت");
    }

    authData = data;
    isAdmin = !!data.is_admin;

    var user = data.user || {};

    document.getElementById("userInfo").innerHTML =
      "<b>" + escapeHtml(
        (user.first_name || "") + " " + (user.last_name || "")
      ) + "</b><br>" +
      (user.username ? "@" + escapeHtml(user.username) : "");

    if(isAdmin){
      document.getElementById("userInfo").innerHTML +=
        "<br>👑 مدیر سیستم";

      document.getElementById("adminBox").style.display = "block";
    }

  }catch(err){

    document.getElementById("userInfo").innerHTML =
      "⚠️ خطا در ورود: " + escapeHtml(err.message);

  }

  loadProducts();
}

/* -----------------------------
   Products
----------------------------- */

async function loadProducts(){

  try{

    var response = await fetch(WORKER_URL + "/api/products");
    var data = await response.json();

    if(!data.ok){
      throw new Error(data.error || "خطا");
    }

    products = data.products || [];

    buildCategories();
    renderProducts();

  }catch(err){

    document.getElementById("products").innerHTML =
      "<div class='msg error' style='display:block'>" +
      "خطا در دریافت محصولات: " +
      escapeHtml(err.message) +
      "</div>";

  }
}

function buildCategories(){

  var set = {};

  products.forEach(function(p){
    if(p.category) set[p.category] = true;
  });

  categories = ["همه"].concat(Object.keys(set));

  var html = "";

  categories.forEach(function(c){

    html +=
      "<button class='cat " +
      (c === currentCategory ? "active" : "") +
      "' onclick='selectCategory(" +
      JSON.stringify(c) +
      ")'>" +
      escapeHtml(c) +
      "</button>";

  });

  document.getElementById("categories").innerHTML = html;
}

function selectCategory(c){
  currentCategory = c;
  buildCategories();
  renderProducts();
}

function renderProducts(){

  var search =
    document.getElementById("search").value
    .trim()
    .toLowerCase();

  var list = products.filter(function(p){

    var categoryOk =
      currentCategory === "همه" ||
      p.category === currentCategory;

    var text =
      ((p.name_fa || "") + " " +
       (p.name_en || "") + " " +
       (p.maker || "")).toLowerCase();

    return categoryOk && text.indexOf(search) !== -1;
  });

  if(!list.length){
    document.getElementById("products").innerHTML =
      "<div>محصولی پیدا نشد.</div>";
    return;
  }

  var html = "";

  list.forEach(function(p){

    var image =
      p.image_url ||
      IMAGE_BASE + "product-" +
      String(p.id).padStart(2,"0") + ".jpg";

    html +=
      "<div class='card' onclick='showProduct(" +
      Number(p.id) + ")'>" +

      "<img src='" + escapeAttr(image) +
      "' onerror=\"this.src='" +
      IMAGE_BASE + "catalog-" +
      String(p.id).padStart(2,"0") +
      ".jpg'\">" +

      "<h3>" + escapeHtml(p.name_fa || "") + "</h3>" +

      "<p>" + escapeHtml(p.name_en || "") + "</p>" +

      "</div>";
  });

  document.getElementById("products").innerHTML = html;
}

/* -----------------------------
   Product Details
----------------------------- */

function showProduct(id){

  var p = products.find(function(x){
    return Number(x.id) === Number(id);
  });

  if(!p) return;

  var image =
    p.image_url ||
    IMAGE_BASE + "product-" +
    String(p.id).padStart(2,"0") + ".jpg";

  var html =
    "<h2>" + escapeHtml(p.name_fa || "") + "</h2>" +

    "<img class='detailimg' src='" +
    escapeAttr(image) + "'>" +

    "<p><b>نام انگلیسی:</b> " +
    escapeHtml(p.name_en || "-") + "</p>" +

    "<p><b>دسته:</b> " +
    escapeHtml(p.category || "-") + "</p>" +

    "<p><b>بسته‌بندی:</b> " +
    escapeHtml(p.package || "-") + "</p>" +

    "<p><b>سازنده:</b> " +
    escapeHtml(p.maker || "-") + "</p>" +

    "<p>" + escapeHtml(p.intro || "") + "</p>" +

    "<p><b>ترکیبات:</b><br>" +
    escapeHtml(p.composition || "-") + "</p>" +

    "<p><b>نحوه مصرف:</b><br>" +
    escapeHtml(p.use_text || "-") + "</p>" +

    "<p><b>هشدار:</b><br>" +
    escapeHtml(p.warnings || "-") + "</p>";

  document.getElementById("productDetail").innerHTML = html;
  document.getElementById("productModal").style.display = "block";
}

/* -----------------------------
   Admin
----------------------------- */

async function openAdmin(){

  if(!isAdmin){
    alert("دسترسی مدیر ندارید.");
    return;
  }

  document.getElementById("adminModal").style.display = "block";
  document.getElementById("adminProducts").innerHTML =
    "<div class='loading'>در حال بارگذاری قیمت‌ها...</div>";

  try{

    var response = await fetch(
      WORKER_URL + "/api/admin/products",
      {
        method:"GET",
        headers:{
          "X-Telegram-Init-Data":tg.initData
        }
      }
    );

    var data = await response.json();

    if(!response.ok || !data.ok){
      throw new Error(data.error || "خطا");
    }

    renderAdminProducts(data.products || []);

  }catch(err){

    document.getElementById("adminProducts").innerHTML =
      "<div class='msg error' style='display:block'>" +
      escapeHtml(err.message) +
      "</div>";
  }
}

function renderAdminProducts(list){

  var html = "";

  list.forEach(function(p){

    var price =
      p.customer_price != null
      ? p.customer_price
      : p.base_price;

    html +=
      "<div class='adminrow'>" +

      "<strong>" +
      escapeHtml(p.name_fa || "") +
      "</strong>" +

      "<div class='pricewrap'>" +

      "<input class='priceinput' " +
      "id='price-" + Number(p.id) + "' " +
      "inputmode='numeric' " +
      "autocomplete='off' " +
      "value='" + escapeAttr(formatPrice(price)) + "' " +
      "oninput='formatPriceInput(this)'>" +

      "<span class='currency'>تومان</span>" +

      "<button class='editbtn' " +
      "onclick='enablePrice(" + Number(p.id) + ")'>" +
      "✏️ ویرایش</button>" +

      "<button class='savebtn' " +
      "onclick='savePrice(" + Number(p.id) + ")'>" +
      "ذخیره</button>" +

      "</div>" +

      "</div>";
  });

  document.getElementById("adminProducts").innerHTML =
    html || "محصولی وجود ندارد.";
}

/* -----------------------------
   Price Formatting
----------------------------- */

function onlyDigits(value){

  return String(value || "")
    .replace(/[^\d]/g,"");
}

function formatPrice(value){

  var digits = onlyDigits(value);

  if(!digits) return "";

  return digits.replace(
    /\B(?=(\d{3})+(?!\d))/g,
    "'"
  );
}

function formatPriceInput(input){

  var oldValue = input.value;
  var digitsBeforeCursor =
    oldValue
    .slice(0,input.selectionStart)
    .replace(/[^\d]/g,"")
    .length;

  var formatted = formatPrice(oldValue);

  input.value = formatted;

  var pos = 0;
  var count = 0;

  while(pos < formatted.length && count < digitsBeforeCursor){

    if(/\d/.test(formatted[pos])){
      count++;
    }

    pos++;
  }

  try{
    input.setSelectionRange(pos,pos);
  }catch(e){}
}

function enablePrice(id){

  var input = document.getElementById("price-" + id);

  if(input){
    input.removeAttribute("readonly");
    input.focus();
    input.select();
  }
}

async function savePrice(productId){

  var input =
    document.getElementById("price-" + productId);

  if(!input) return;

  var digits = onlyDigits(input.value);

  if(!digits){

    showAdminMessage(
      "لطفاً قیمت را وارد کنید.",
      false
    );

    input.focus();
    return;
  }

  var price = Number(digits);

  if(!Number.isSafeInteger(price)){

    showAdminMessage(
      "قیمت وارد شده معتبر نیست.",
      false
    );

    return;
  }

  var buttons =
    document.querySelectorAll(".savebtn");

  buttons.forEach(function(b){
    b.disabled = true;
  });

  try{

    var response = await fetch(
      WORKER_URL + "/api/admin/update-price",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "X-Telegram-Init-Data":tg.initData
        },
        body:JSON.stringify({
          product_id:Number(productId),
          price:price,
          currency:"تومان"
        })
      }
    );

    var text = await response.text();
    var data;

    try{
      data = JSON.parse(text);
    }catch(e){
      throw new Error(
        "پاسخ سرور JSON معتبر نیست: " + text
      );
    }

    if(!response.ok || !data.ok){
      throw new Error(data.error || "ذخیره قیمت ناموفق بود");
    }

    input.value = formatPrice(price);

    showAdminMessage(
      "✅ قیمت با موفقیت ذخیره شد.",
      true
    );

  }catch(err){

    showAdminMessage(
      "❌ " + err.message,
      false
    );

  }finally{

    buttons.forEach(function(b){
      b.disabled = false;
    });
  }
}

function showAdminMessage(text,success){

  var box = document.getElementById("adminMsg");

  box.className =
    "msg " + (success ? "success" : "error");

  box.style.display = "block";
  box.textContent = text;
}

/* -----------------------------
   Helpers
----------------------------- */

function closeModal(id){
  document.getElementById(id).style.display = "none";
}

function escapeHtml(value){

  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

authenticate();
</script>

</body>
</html>
