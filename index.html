<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>مشکفام فارس</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Tahoma,
        Arial,
        sans-serif;
      background: #f5f7f6;
      color: #1f2937;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 14px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: linear-gradient(135deg, #126b3a, #219653);
      color: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
    }

    .brand p {
      margin: 7px 0 0;
      opacity: .9;
      font-size: 13px;
    }

    .telegram-user {
      display: none;
      background: rgba(255,255,255,.15);
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      min-width: 130px;
    }

    .telegram-user strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin: 14px 0;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d7ded9;
      border-radius: 14px;
      background: white;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #219653;
      box-shadow: 0 0 0 3px rgba(33,150,83,.1);
    }

    /* =========================
       CATEGORIES
    ========================= */

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 10px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      border: none;
      background: white;
      color: #374151;
      padding: 9px 14px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid #e2e7e3;
      font-size: 13px;
    }

    .category-btn.active {
      background: #219653;
      color: white;
      border-color: #219653;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      background: white;
      font-size: 13px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #b42318;
      background: #fff4f2;
    }

    .status.success {
      color: #166534;
      background: #f0fdf4;
    }

    /* =========================
       PRODUCTS GRID
    ========================= */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .product-card {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      border: 1px solid #e5e9e6;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,.09);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #f7f8f7;
      display: block;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-weight: bold;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 4px;
    }

    .product-en {
      direction: ltr;
      text-align: right;
      font-size: 11px;
      color: #6b7280;
      min-height: 18px;
    }

    .product-category {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      background: #edf8f1;
      color: #16703e;
      border-radius: 7px;
      font-size: 10px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      padding: 35px 15px;
      border-radius: 16px;
      text-align: center;
      color: #6b7280;
      display: none;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(700px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      position: relative;
      padding: 18px;
    }

    .modal-close {
      position: sticky;
      top: 0;
      float: left;
      border: none;
      background: #f1f3f2;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      z-index: 3;
    }

    .modal-image {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      background: #f7f8f7;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .modal-en {
      direction: ltr;
      text-align: right;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .detail-section {
      margin-top: 15px;
      border-top: 1px solid #edf0ee;
      padding-top: 13px;
    }

    .detail-section h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #126b3a;
    }

    .detail-section p {
      margin: 0;
      line-height: 2;
      font-size: 13px;
      white-space: pre-line;
    }

    .benefits {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .benefit {
      background: #edf8f1;
      color: #166534;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 12px;
    }

    .media-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .media-btn {
      border: none;
      border-radius: 11px;
      padding: 11px 15px;
      cursor: pointer;
      text-decoration: none;
      background: #219653;
      color: white;
      font-size: 13px;
    }

    .media-btn.secondary {
      background: #eef2f0;
      color: #166534;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-box {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #e3e8e4;
    }

    .profile-title {
      font-weight: bold;
      color: #126b3a;
      margin-bottom: 10px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #f0f2f1;
      font-size: 13px;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 45px 15px;
      color: #6b7280;
      background: white;
      border-radius: 16px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #dce8df;
      border-top-color: #219653;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .app {
        padding: 10px;
      }

      .header {
        padding: 16px;
      }

      .header-top {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 20px;
      }

      .telegram-user {
        min-width: 110px;
        font-size: 10px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-info {
        padding: 9px;
      }

      .product-name {
        font-size: 13px;
      }

      .modal-content {
        padding: 14px;
        border-radius: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <div class="header-top">

      <div class="brand">
        <h1>🌱 مشکفام فارس</h1>
        <p>سامانه محصولات و خدمات کشاورزی</p>
      </div>

      <div
        id="telegramUser"
        class="telegram-user"
      >
        <strong id="telegramName">کاربر</strong>
        <span id="telegramUsername"></span>
      </div>

    </div>

  </header>


  <!-- =========================
       PROFILE
  ========================= -->

  <div
    id="profileBox"
    class="profile-box"
  >

    <div class="profile-title">
      👤 پروفایل
    </div>

    <div class="profile-row">
      <span>نام</span>
      <strong id="profileName">-</strong>
    </div>

    <div class="profile-row">
      <span>نام کاربری</span>
      <strong id="profileUsername">-</strong>
    </div>

    <div class="profile-row">
      <span>وضعیت حساب</span>
      <strong id="profileStatus">فعال</strong>
    </div>

  </div>


  <!-- =========================
       SEARCH
  ========================= -->

  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="🔎 جستجوی محصول..."
      autocomplete="off"
    >

  </div>


  <!-- =========================
       CATEGORIES
  ========================= -->

  <div
    id="categories"
    class="categories"
  >
  </div>


  <!-- =========================
       STATUS
  ========================= -->

  <div
    id="status"
    class="status"
  >
  </div>


  <!-- =========================
       PRODUCTS
  ========================= -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    در حال دریافت محصولات...

  </div>


  <div
    id="productsGrid"
    class="products-grid"
  >
  </div>


  <div
    id="empty"
    class="empty"
  >
    محصولی پیدا نشد.
  </div>

</div>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="modal"
>

  <div class="modal-content">

    <button
      id="modalClose"
      class="modal-close"
      type="button"
    >
      ×
    </button>

    <img
      id="modalImage"
      class="modal-image"
      alt=""
    >

    <div
      id="modalTitle"
      class="modal-title"
    >
    </div>

    <div
      id="modalEn"
      class="modal-en"
    >
    </div>


    <div
      id="modalIntroSection"
      class="detail-section"
    >

      <h3>معرفی محصول</h3>

      <p id="modalIntro"></p>

    </div>


    <div
      id="modalBenefitsSection"
      class="detail-section"
    >

      <h3>مزایا</h3>

      <div
        id="modalBenefits"
        class="benefits"
      >
      </div>

    </div>


    <div
      id="modalCompositionSection"
      class="detail-section"
    >

      <h3>ترکیبات</h3>

      <p id="modalComposition"></p>

    </div>


    <div
      id="modalUseSection"
      class="detail-section"
    >

      <h3>نحوه مصرف</h3>

      <p id="modalUse"></p>

    </div>


    <div
      id="modalWarningsSection"
      class="detail-section"
    >

      <h3>هشدارها</h3>

      <p id="modalWarnings"></p>

    </div>


    <div
      id="modalPackageSection"
      class="detail-section"
    >

      <h3>بسته‌بندی</h3>

      <p id="modalPackage"></p>

    </div>


    <div
      id="modalMakerSection"
      class="detail-section"
    >

      <h3>تولیدکننده</h3>

      <p id="modalMaker"></p>

    </div>


    <div class="media-buttons">

      <a
        id="catalogButton"
        class="media-btn"
        href="#"
        target="_blank"
        rel="noopener"
      >
        📖 مشاهده کاتالوگ
      </a>

      <a
        id="videoButton"
        class="media-btn secondary"
        href="#"
        target="_blank"
        rel="noopener"
      >
        🎬 مشاهده ویدئو
      </a>

    </div>

  </div>

</div>


<script>

  /* =======================================================
     CONFIG
  ======================================================= */

  const WORKER_URL =
    "https://moshkfam-telegram-bot.dehghaniweb.workers.dev";

  const GITHUB_BASE =
    "https://dehghaniweb.github.io/moshkfam/";

  const IMAGES_BASE =
    GITHUB_BASE + "Images/";


  /* =======================================================
     TELEGRAM
  ======================================================= */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if (tg) {

    try {
      tg.ready();
      tg.expand();
    }
    catch (error) {
      console.log("Telegram WebApp error:", error);
    }

  }


  /* =======================================================
     GLOBAL DATA
  ======================================================= */

  let products = [];

  let activeCategory = "همه";


  /* =======================================================
     ELEMENTS
  ======================================================= */

  const loading =
    document.getElementById("loading");

  const productsGrid =
    document.getElementById("productsGrid");

  const empty =
    document.getElementById("empty");

  const searchInput =
    document.getElementById("searchInput");

  const categories =
    document.getElementById("categories");

  const statusBox =
    document.getElementById("status");


  /* =======================================================
     STATUS MESSAGE
  ======================================================= */

  function showStatus(
    message,
    type
  ) {

    statusBox.textContent =
      message || "";

    statusBox.className =
      "status show " +
      (type || "");

  }


  function hideStatus() {

    statusBox.className =
      "status";

    statusBox.textContent =
      "";

  }


  /* =======================================================
     SAFE TEXT
  ======================================================= */

  function safeText(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }

    return String(value);

  }


  /* =======================================================
     PRODUCT IMAGE URL
  ======================================================= */

  function getProductImageUrl(
    product
  ) {

    const id =
      Number(product.id || 0);

    if (!id) {
      return "";
    }

    const number =
      String(id).padStart(2, "0");

    return (
      IMAGES_BASE +
      "product" +
      number +
      ".jpg"
    );

  }


  /* =======================================================
     CATALOG IMAGE URL
  ======================================================= */

  function getCatalogImageUrl(
    product
  ) {

    const id =
      Number(product.id || 0);

    if (!id) {
      return "";
    }

    const number =
      String(id).padStart(2, "0");

    return (
      IMAGES_BASE +
      "catalog-" +
      number +
      ".jpg"
    );

  }


  /* =======================================================
     IMAGE ERROR FALLBACK
  ======================================================= */

  function imageError(
    img,
    product
  ) {

    if (!img) {
      return;
    }

    img.onerror = null;

    const id =
      Number(product.id || 0);

    const number =
      String(id).padStart(2, "0");

    img.src =
      IMAGES_BASE +
      "product" +
      number +
      ".jpg";

  }


  /* =======================================================
     GET PRODUCTS
  ======================================================= */

  async function loadProducts() {

    loading.style.display =
      "block";

    productsGrid.innerHTML =
      "";

    empty.style.display =
      "none";

    hideStatus();


    try {

      const response =
        await fetch(
          WORKER_URL +
          "/api/products",
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "خطا در دریافت محصولات."
        );

      }


      if (
        !data.ok ||
        !Array.isArray(data.products)
      ) {

        throw new Error(
          "اطلاعات محصولات نامعتبر است."
        );

      }


      products =
        data.products;


      loading.style.display =
        "none";


      createCategories();

      renderProducts();


      if (products.length > 0) {

        showStatus(
          products.length +
          " محصول با موفقیت دریافت شد.",
          "success"
        );

        setTimeout(
          hideStatus,
          2500
        );

      }

    }
    catch(error) {

      loading.style.display =
        "none";

      showStatus(
        "خطا در دریافت محصولات: " +
        error.message,
        "error"
      );

      console.error(
        "Products error:",
        error
      );

    }

  }


  /* =======================================================
     CREATE CATEGORIES
  ======================================================= */

  function createCategories() {

    categories.innerHTML =
      "";


    const categorySet =
      new Set();


    products.forEach(
      function(product) {

        const category =
          safeText(
            product.category
          ).trim();

        if (category) {
          categorySet.add(category);
        }

      }
    );


    const allButton =
      document.createElement("button");

    allButton.type =
      "button";

    allButton.className =
      "category-btn active";

    allButton.textContent =
      "همه";

    allButton.addEventListener(
      "click",
      function() {

        activeCategory =
          "همه";

        updateCategoryButtons();

        renderProducts();

      }
    );


    categories.appendChild(
      allButton
    );


    Array.from(categorySet)
      .sort()
      .forEach(
        function(category) {

          const button =
            document.createElement("button");

          button.type =
            "button";

          button.className =
            "category-btn";

          button.textContent =
            category;

          button.dataset.category =
            category;

          button.addEventListener(
            "click",
            function() {

              activeCategory =
                category;

              updateCategoryButtons();

              renderProducts();

            }
          );


          categories.appendChild(
            button
          );

        }
      );

  }


  /* =======================================================
     CATEGORY BUTTON STATE
  ======================================================= */

  function updateCategoryButtons() {

    const buttons =
      categories.querySelectorAll(
        ".category-btn"
      );


    buttons.forEach(
      function(button) {

        const category =
          button.dataset.category ||
          "همه";


        button.classList.toggle(
          "active",
          category === activeCategory
        );

      }
    );

  }


  /* =======================================================
     FILTER PRODUCTS
  ======================================================= */

  function getFilteredProducts() {

    const search =
      safeText(
        searchInput.value
      )
      .trim()
      .toLowerCase();


    return products.filter(
      function(product) {

        const category =
          safeText(
            product.category
          );


        if (
          activeCategory !== "همه" &&
          category !== activeCategory
        ) {

          return false;

        }


        if (!search) {
          return true;
        }


        const searchable =
          [
            product.name_fa,
            product.name_en,
            product.category,
            product.maker,
            product.intro,
            product.composition,
            product.use_text
          ]
          .map(safeText)
          .join(" ")
          .toLowerCase();


        return searchable.includes(
          search
        );

      }
    );

  }


  /* =======================================================
     RENDER PRODUCTS
  ======================================================= */

  function renderProducts() {

    productsGrid.innerHTML =
      "";

    empty.style.display =
      "none";


    const filtered =
      getFilteredProducts();


    if (filtered.length === 0) {

      empty.style.display =
        "block";

      return;

    }


    filtered.forEach(
      function(product) {

        const card =
          document.createElement("div");

        card.className =
          "product-card";


        const image =
          document.createElement("img");

        image.className =
          "product-image";

        image.alt =
          safeText(
            product.name_fa
          );


        image.src =
          getProductImageUrl(
            product
          );


        image.onerror =
          function() {

            imageError(
              image,
              product
            );

          };


        const info =
          document.createElement("div");

        info.className =
          "product-info";


        const name =
          document.createElement("div");

        name.className =
          "product-name";

        name.textContent =
          safeText(
            product.name_fa
          );


        const en =
          document.createElement("div");

        en.className =
          "product-en";

        en.textContent =
          safeText(
            product.name_en
          );


        info.appendChild(
          name
        );

        info.appendChild(
          en
        );


        if (
          safeText(
            product.category
          )
        ) {

          const category =
            document.createElement("span");

          category.className =
            "product-category";

          category.textContent =
            safeText(
              product.category
            );

          info.appendChild(
            category
          );

        }


        card.appendChild(
          image
        );

        card.appendChild(
          info
        );


        card.addEventListener(
          "click",
          function() {

            openProductModal(
              product
            );

          }
        );


        productsGrid.appendChild(
          card
        );

      }
    );

  }


  /* =======================================================
     OPEN PRODUCT MODAL
  ======================================================= */

  function openProductModal(
    product
  ) {

    const modal =
      document.getElementById(
        "productModal"
      );


    const modalImage =
      document.getElementById(
        "modalImage"
      );


    modalImage.src =
      getProductImageUrl(
        product
      );


    modalImage.alt =
      safeText(
        product.name_fa
      );


    modalImage.onerror =
      function() {

        imageError(
          modalImage,
          product
        );

      };


    document.getElementById(
      "modalTitle"
    ).textContent =
      safeText(
        product.name_fa
      );


    document.getElementById(
      "modalEn"
    ).textContent =
      safeText(
        product.name_en
      );


    setSectionText(
      "modalIntroSection",
      "modalIntro",
      product.intro
    );


    setBenefits(
      product.benefits
    );


    setSectionText(
      "modalCompositionSection",
      "modalComposition",
      product.composition
    );


    setSectionText(
      "modalUseSection",
      "modalUse",
      product.use_text
    );


    setSectionText(
      "modalWarningsSection",
      "modalWarnings",
      product.warnings
    );


    setSectionText(
      "modalPackageSection",
      "modalPackage",
      product.package
    );


    setSectionText(
      "modalMakerSection",
      "modalMaker",
      product.maker
    );


    const catalogButton =
      document.getElementById(
        "catalogButton"
      );


    catalogButton.href =
      getCatalogImageUrl(
        product
      );


    catalogButton.style.display =
      "inline-block";


    const videoButton =
      document.getElementById(
        "videoButton"
      );


    const videoUrl =
      safeText(
        product.video_url
      ).trim();


    if (videoUrl) {

      videoButton.href =
        videoUrl;

      videoButton.style.display =
        "inline-block";

    }
    else {

      videoButton.style.display =
        "none";

    }


    modal.classList.add(
      "show"
    );


    document.body.style.overflow =
      "hidden";

  }


  /* =======================================================
     SET SECTION TEXT
  ======================================================= */

  function setSectionText(
    sectionId,
    elementId,
    value
  ) {

    const section =
      document.getElementById(
        sectionId
      );

    const element =
      document.getElementById(
        elementId
      );


    const text =
      safeText(
        value
      ).trim();


    if (text) {

      element.textContent =
        text;

      section.style.display =
        "block";

    }
    else {

      element.textContent =
        "";

      section.style.display =
        "none";

    }

  }


  /* =======================================================
     BENEFITS
  ======================================================= */

  function setBenefits(
    benefits
  ) {

    const section =
      document.getElementById(
        "modalBenefitsSection"
      );


    const container =
      document.getElementById(
        "modalBenefits"
      );


    container.innerHTML =
      "";


    let list = [];


    if (Array.isArray(benefits)) {

      list =
        benefits.filter(
          function(item) {

            return safeText(
              item
            ).trim();

          }
        );

    }
    else if (
      typeof benefits === "string" &&
      benefits.trim()
    ) {

      list =
        benefits
          .split(/\n|،|,/)
          .map(
            function(item) {
              return item.trim();
            }
          )
          .filter(Boolean);

    }


    if (list.length === 0) {

      section.style.display =
        "none";

      return;

    }


    list.forEach(
      function(item) {

        const span =
          document.createElement("span");

        span.className =
          "benefit";

        span.textContent =
          safeText(item);

        container.appendChild(
          span
        );

      }
    );


    section.style.display =
      "block";

  }


  /* =======================================================
     CLOSE MODAL
  ======================================================= */

  function closeModal() {

    const modal =
      document.getElementById(
        "productModal"
      );


    modal.classList.remove(
      "show"
    );


    document.body.style.overflow =
      "";

  }


  document.getElementById(
    "modalClose"
  ).addEventListener(
    "click",
    closeModal
  );


  document.getElementById(
    "productModal"
  ).addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeModal();

      }

    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape"
      ) {

        closeModal();

      }

    }
  );


  /* =======================================================
     SEARCH EVENT
  ======================================================= */

  searchInput.addEventListener(
    "input",
    function() {

      renderProducts();

    }
  );


  /* =======================================================
     TELEGRAM USER
  ======================================================= */

  async function authenticateTelegram() {

    if (!tg) {
      return;
    }


    const initData =
      tg.initData;


    if (!initData) {
      return;
    }


    try {

      const response =
        await fetch(
          WORKER_URL +
          "/api/telegram-auth",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                initData:
                  initData
              })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.ok
      ) {

        console.error(
          "Telegram authentication failed:",
          data
        );

        return;

      }


      if (data.customer) {

        showTelegramCustomer(
          data.customer
        );

      }

    }
    catch(error) {

      console.error(
        "Telegram auth error:",
        error
      );

    }

  }


  /* =======================================================
     SHOW TELEGRAM CUSTOMER
  ======================================================= */

  function showTelegramCustomer(
    customer
  ) {

    const box =
      document.getElementById(
        "telegramUser"
      );


    const name =
      document.getElementById(
        "telegramName"
      );


    const username =
      document.getElementById(
        "telegramUsername"
      );


    const profileBox =
      document.getElementById(
        "profileBox"
      );


    const profileName =
      document.getElementById(
        "profileName"
      );


    const profileUsername =
      document.getElementById(
        "profileUsername"
      );


    const profileStatus =
      document.getElementById(
        "profileStatus"
      );


    const fullName =
      [
        customer.first_name,
        customer.last_name
      ]
      .filter(Boolean)
      .join(" ");


    name.textContent =
      fullName ||
      "کاربر Telegram";


    username.textContent =
      customer.username
        ? "@" +
          customer.username +
          " • حساب فعال"
        : "حساب فعال";


    box.style.display =
      "block";


    profileName.textContent =
      fullName ||
      "-";


    profileUsername.textContent =
      customer.username
        ? "@" +
          customer.username
        : "-";


    profileStatus.textContent =
      customer.status === "active"
        ? "فعال"
        : safeText(
            customer.status
          ) || "فعال";


    profileBox.style.display =
      "block";

  }


  /* =======================================================
     START
  ======================================================= */

  authenticateTelegram();

  loadProducts();

</script>
