<style>
:root{--bg:#f4f7f3;--card:#fff;--ink:#172019;--muted:#657066;--green:#16834a;--green2:#0d6337;--gold:#d5a62a;--line:#e2e9e3;--shadow:0 8px 25px rgba(20,45,27,.08)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh}
.app{max-width:1100px;margin:auto;min-height:100vh}

header{
background:linear-gradient(145deg,#0c2417,#123c25 55%,#0d5d34);
color:#fff;
padding:24px 18px 20px;
border-radius:0 0 28px 28px;
box-shadow:0 8px 28px rgba(0,0,0,.16)
}

.brand{display:flex;align-items:center;gap:13px}
.logo{
width:54px;height:54px;border-radius:16px;background:#fff;
display:grid;place-items:center;color:#177440;font-size:29px;
font-weight:900;box-shadow:0 4px 15px #0003
}
h1{font-size:21px;margin:0 0 4px}
.subtitle{font-size:12px;color:#d9eadf}

.search{margin-top:18px;position:relative}
.search input{
width:100%;border:0;border-radius:17px;
padding:14px 48px 14px 15px;outline:none;
background:#fff;color:#172019;
box-shadow:0 5px 18px #0002
}
.search span{
position:absolute;right:17px;top:50%;
transform:translateY(-50%);
font-size:21px;color:#718077
}

main{padding:18px}
.toolbar{
display:flex;gap:8px;overflow:auto;padding:2px 0 14px;
scrollbar-width:none
}
.toolbar::-webkit-scrollbar{display:none}

.chip{
white-space:nowrap;border:1px solid var(--line);
background:#fff;color:#536057;border-radius:999px;
padding:9px 14px;font-size:12px
}
.chip.active{
background:var(--green);
border-color:var(--green);
color:#fff
}

.count{font-size:12px;color:var(--muted);margin:0 2px 14px}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:18px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:24px;
overflow:hidden;
box-shadow:0 8px 28px rgba(20,45,27,.08);
transition:transform .18s,box-shadow .18s;
display:grid;
grid-template-columns:minmax(165px,42%) minmax(0,1fr);
min-height:230px;
cursor:pointer
}

.card:hover{
transform:translateY(-2px);
box-shadow:0 12px 32px rgba(20,45,27,.12)
}

.card:active{transform:scale(.985)}

.pic{
min-height:230px;
background:linear-gradient(145deg,#fafcf9,#eef4ef);
display:flex;
align-items:center;
justify-content:center;
padding:16px;
border-left:1px solid #edf1ed
}

.pic img{
width:100%;
height:100%;
max-height:215px;
object-fit:contain;
display:block
}

.info{
padding:22px 20px;
display:flex;
flex-direction:column;
justify-content:center;
min-width:0
}

.name{
font-size:18px;
font-weight:900;
margin:0 0 6px;
line-height:1.6;
color:#172019;
overflow-wrap:anywhere
}

.en{
font-size:11px;
color:#7b857e;
direction:ltr;
text-align:right;
line-height:1.6;
white-space:normal;
overflow-wrap:anywhere;
margin-bottom:13px
}

.spec{
display:grid;
gap:7px;
font-size:12px;
line-height:1.7;
color:#59645c
}

.spec div{
background:#f5f8f5;
border-radius:10px;
padding:6px 9px
}

.spec b{
color:var(--green2);
font-weight:800
}

.empty{
background:#fff;
border:1px dashed #ccd8ce;
border-radius:16px;
padding:30px;
text-align:center;
color:#657066
}

@media(max-width:850px){
.grid{grid-template-columns:1fr}
.card{
grid-template-columns:180px minmax(0,1fr);
min-height:220px
}
.pic{min-height:220px}
.info{padding:19px}
.name{font-size:17px}

.info{padding:15px 13px}
.name{font-size:15px;line-height:1.55}
.en{font-size:10px;margin-bottom:10px}
.spec{font-size:10px;gap:5px}

.detail-en{

.badges{
display:flex;
gap:8px;

margin:16px 0

.badge{
padding:8px 11px;
background:#edf6ef;
border-radius:10px;
font-size:11px;
color:#31583e
}

.product-details{
margin:0 22px 22px;
padding:18px;
background:#f8fbf8;
border:1px solid #e2e9e3;
border-radius:16px
}

.product-details h3{
margin:0 0 9px;
font-size:16px;
color:#123c25

.product-details .intro{
font-size:12px;
line-height:2.05;
color:#39443d;
margin:0 0 14px

.detail-block{margin-top:14px}

.detail-block h4{
margin:0 0 7px;
font-size:12px;
color:#16834a

.detail-block ul{
margin:0;
padding:0 18px

.detail-block li{
font-size:11px;
line-height:1.95;
color:#566158;
margin:2px 0

.detail-block p{
font-size:11px;

.detail-use{

.source-note{display:none}

.page-wrap{

.page-wrap h3{

.page-img{

.modal{align-items:flex-start}
.sheet{width:100%;min-height:100vh}
.sheet-head{padding:11px 13px}

.detail-en{font-size:10px}

/* =========================================================
   CATEGORIES
========================================================= */

const categories = [
"همه",
"اصلاح‌کننده خاک",
"محرک رشد",
"محرک رشد طبیعی",
"میکرو مغذی",
"NPK + TE"
];

let active = "همه";


const grid =
document.getElementById("grid");

const search =
document.getElementById("search");

const count =
document.getElementById("count");

const filters =
document.getElementById("filters");

const modal =
document.getElementById("modal");

const detail =
document.getElementById("detail");


/* =========================================================
   FILTERS
========================================================= */

function makeFilters(){

filters.innerHTML =
categories
.map(function(c){

return '<button class="chip ' +
(c === active ? 'active' : '') +
'" onclick="setCat(' +
JSON.stringify(c) +
')">' +
c +
'</button>';

})
.join("");

}


function setCat(c){

active = c;

makeFilters();

render();

}


function matches(p,q){

if(!q){
return true;
}

q =
q.toLowerCase();

return [
p.en,
p.fa,
p.cat,
p.pack,
p.maker
]
.join(" ")
.toLowerCase()
.includes(q);

}


/* =========================================================
   RENDER
========================================================= */

function render(){

const q =
search.value.trim();

const list =
products.filter(function(p){

return (
(active === "همه" || p.cat === active) &&
matches(p,q)
);

});


count.textContent =
list.length + " محصول";


grid.innerHTML =
list.length
?
list.map(function(p){

return '<article class="card" onclick="openProduct(' +
p.id +
')">' +

'<div class="pic">' +

'<img src="' +
p.productPhoto +
'" alt="' +
p.fa +
'" loading="lazy">' +

'</div>' +

'<div class="info">' +

'<h2 class="name">' +
p.fa +
'</h2>' +

'<div class="en">' +
p.en +
'</div>' +

'<div class="spec">' +

'<div><b>گروه:</b> ' +
p.cat +
'</div>' +

'<div><b>بسته‌بندی:</b> ' +
p.pack +
'</div>' +

'<div><b>تولید:</b> ' +
p.maker +
'</div>' +

'</div>' +

'</div>' +

'</article>';

})
.join("")
:
'<div class="empty" style="grid-column:1/-1">' +
'محصولی با این جستجو پیدا نشد.' +

}

.onclick = closeModal;

}

}
);

closeModal();
}

}
);

);

/* =========================================================
   TELEGRAM MINI APP AUTHENTICATION
========================================================= */

async function telegramLogin(){

try {


/* -------------------------------------------------------
   بررسی وجود Telegram WebApp
------------------------------------------------------- */

if(
!window.Telegram ||
!window.Telegram.WebApp
){

console.log(
"Telegram WebApp در دسترس نیست."
);

return;

}


const tg =
window.Telegram.WebApp;


/* -------------------------------------------------------
   آماده‌سازی Mini App
------------------------------------------------------- */

tg.ready();


if(
typeof tg.expand === "function"
){

tg.expand();

}


/* -------------------------------------------------------
   دریافت initData
------------------------------------------------------- */

const initData =
tg.initData;


console.log(
"Telegram initData:",
initData
);


/* -------------------------------------------------------
   بررسی خالی نبودن initData
------------------------------------------------------- */

if(!initData){

console.error(
"Telegram initData خالی است."
);

alert(
"این صفحه باید از داخل Telegram باز شود."
);

return;

}


/* -------------------------------------------------------
   ارسال به Worker
------------------------------------------------------- */

const response =
await fetch(

"https://moshkfam-telegram-bot.dehghaniweb.workers.dev/api/telegram-auth",

{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

initData:
initData

})

}

);


/* -------------------------------------------------------
   دریافت پاسخ
------------------------------------------------------- */

const result =
await response.json();


console.log(
"Telegram auth result:",
result
);


/* -------------------------------------------------------
   بررسی نتیجه
------------------------------------------------------- */

if(!result.ok){

console.error(
"ورود ناموفق:",
result.error
);

alert(
"ورود ناموفق: " +
(
result.error ||
"خطای نامشخص"
)
);

return;

}


/* -------------------------------------------------------
   ذخیره اطلاعات مشتری
------------------------------------------------------- */

window.moshkfamCustomer =
result.customer;


console.log(
"ورود موفق:",
result.customer
);


/* -------------------------------------------------------
   فعلاً اطلاعات را در کنسول نگه می‌داریم.
   در مرحله بعد می‌توانیم نام مشتری،
   قیمت اختصاصی و پروفایل را نمایش دهیم.
------------------------------------------------------- */

}
catch(error){

console.error(
"Telegram Login Error:",
error
);

alert(
"خطا در اتصال به سامانه."
);

}

}


/* =========================================================
   START TELEGRAM LOGIN
========================================================= */

telegramLogin();

</script>
